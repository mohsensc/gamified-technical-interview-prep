  <script>
    try {
      const rawState = JSON.parse(localStorage.getItem('codecram-state') || localStorage.getItem('google-cram-state') || '{}')
      const legacyTheme = rawState?.settings?.theme
      const migratedLight = Boolean(rawState?.settings?.themeMigratedLight)
      const savedTheme = localStorage.getItem('codecram-theme') || legacyTheme
      if (savedTheme === 'dark' && !migratedLight) document.documentElement.dataset.theme = 'light'
      else if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme
      else document.documentElement.dataset.theme = 'light'
    } catch {}
  </script>
