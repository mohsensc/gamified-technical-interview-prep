<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TechPrep</title>
  <meta name="description" content="Coding interview prep that runs on your own computer.">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    try {
      const savedTheme = localStorage.getItem('techprep-theme')
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light'
    } catch {}
  </script>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/items.css">

  <link rel="stylesheet" href="/src/styles/mock.css">

  <link rel="stylesheet" href="/src/styles/practice.css">
  <link rel="stylesheet" href="/src/styles/algorithms.css">
  <link rel="stylesheet" href="/src/styles/read.css">
  <link rel="stylesheet" href="/src/styles/cheatsheet.css">
  <link rel="stylesheet" href="/src/styles/dayof.css">
  <link rel="stylesheet" href="/src/styles/thought.css">
  <link rel="stylesheet" href="/src/styles/home.css">
  <link rel="stylesheet" href="/src/styles/settings.css">
</head>

  <div id="app"><div class="boot-screen" aria-busy="true"><span class="brand-mark">&lt;/&gt;</span></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
